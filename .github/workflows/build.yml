# Tests without game data, then the one-dir bundles (packaging/warlords2.spec) for Windows,
# macOS and Linux; a v* tag also drafts a GitHub Release with the archives.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      WL2_NO_DATA: "1"                  # no game files on CI: the gamedata tests are deselected
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -m "not gamedata" -q

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: warlords2-windows-x64
          # macos-15 (arm64); macos-14 is retired (runner-images #13518, unsupported from 2026-11-02)
          - os: macos-15
            name: warlords2-macos-arm64
          - os: macos-15-intel
            name: warlords2-macos-x64
          - os: ubuntu-22.04
            name: warlords2-linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      # not requirements-music.txt: the GPL renderer is not part of the bundle
      - run: pip install . -r requirements-build.txt
      - run: pyinstaller --noconfirm packaging/warlords2.spec

      - name: Nothing excluded got in
        run: |
          test -f build/warlords2/PYZ-00.toc
          bad=$(find dist -iname '*pyopl*' -o -iname '*tinysoundfont*' -o -iname 'cv2' \
                -o -iname 'PIL' -o -iname '*pygame_screen_record*' -o -iname '*readline*')
          bad+=$(grep -oE "\('(pyopl|tinysoundfont|cv2|PIL|pygame_screen_record)[A-Za-z0-9_.]*'" \
                 build/warlords2/PYZ-00.toc | sort -u || true)
          if [ -n "$bad" ]; then echo "excluded modules in the bundle: $bad"; exit 1; fi
          n=$(find dist/warlords2/_internal/warlords2/data/music -name '*.ogg' | wc -l)
          echo "bundled music: $n OGGs"
          [ "$n" -gt 0 ] && [ "$n" -eq "$(find warlords2/data/music -name '*.ogg' | wc -l)" ]

      - name: Smoke test
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/warlords2/warlords2.exe ;;
            macOS)   exe="dist/Warlords II.app/Contents/MacOS/warlords2" ;;
            *)       exe=dist/warlords2/warlords2 ;;
          esac
          # windowed builds (Windows, macOS) write stdout / stderr to WL2_LOG (packaging/entry.py)
          export WL2_LOG="$RUNNER_TEMP/wl2.log"
          # (cat of a missing log fails under the step's pipefail: collect into files first)
          "$exe" --help > out.txt 2>&1
          { cat out.txt; cat "$WL2_LOG" 2>/dev/null || true; } > help.txt
          grep -q "usage:" help.txt || { cat help.txt; exit 1; }
          mkdir -p "$RUNNER_TEMP/empty"
          if "$exe" --headless --data "$RUNNER_TEMP/empty" > out.txt 2>&1; then
            cat out.txt; echo "expected a non-zero exit without game files"; exit 1
          fi
          { cat out.txt; cat "$WL2_LOG" 2>/dev/null || true; } > all.txt
          cat all.txt
          grep -q "WARLORD2.EXE not found in" all.txt

      - name: Archive
        run: |
          case "$RUNNER_OS" in
            Windows) 7z a "${{ matrix.name }}.zip" ./dist/warlords2 ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent "dist/Warlords II.app" "${{ matrix.name }}.zip" ;;
            *)       tar -C dist -czf "${{ matrix.name }}.tar.gz" warlords2 ;;
          esac
      # archive: false uploads the one file as is (no zip around it); the artifact is
      # then named after the file
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.name }}.${{ runner.os == 'Linux' && 'tar.gz' || 'zip' }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

      # Windows installer (packaging/warlords2.iss): pick a folder, the game is fetched
      - name: Installer
        if: runner.os == 'Windows'
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || choco install innosetup --no-progress -y
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          "$iscc" "/DAppVersion=$version" packaging/warlords2.iss
          test -f dist/warlords2-windows-x64-setup.exe
      - name: Installer test (silent install, game fetched, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Warlords II"
          $p = Start-Process dist\warlords2-windows-x64-setup.exe -Wait -PassThru -ArgumentList `
               '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=`"$dir`"", '/LOG=setup.log'
          if ($p.ExitCode -ne 0) { Get-Content setup.log; exit 1 }
          if (-not (Test-Path "$dir\warlords2.exe")) { Get-Content setup.log; exit 1 }
          if (-not (Test-Path "$dir\Warlrd2\WARLORD2.EXE")) {
            Get-Content setup.log; Get-Content "$env:APPDATA\warlords2\warlords2.log" -ErrorAction SilentlyContinue
            Write-Error "the game files were not fetched"; exit 1
          }
          $p = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          Start-Sleep -Seconds 5            # the uninstaller finishes in a copy of itself
          if (Test-Path "$dir\Warlrd2") { Write-Error "uninstall left the game files"; exit 1 }
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          path: dist/warlords2-windows-x64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: archives
          merge-multiple: true
          # the artifacts are the bundle archives themselves; keep the .zip files whole
          skip-decompress: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: archives/*
          body: |
            Warlords II (DOS v1.02) reimplemented. It needs the original DOS game files: the
            first start offers to download them from the Internet Archive, or to choose your
            own folder (the one with WARLORD2.EXE).

            - Windows: run `warlords2-windows-x64-setup.exe` and pick the install folder; setup
              downloads the game files. Or unzip `warlords2-windows-x64.zip` and run
              `warlords2\warlords2.exe`. SmartScreen may warn about an unknown publisher
              (More info, Run anyway).
            - macOS 14 or newer: unzip and move `Warlords II.app` to Applications. The app is
              not signed: start it once, then System Settings, Privacy & Security, Open Anyway,
              or run `xattr -dr com.apple.quarantine "/Applications/Warlords II.app"`.
            - Linux: `tar xzf` and run `warlords2/warlords2`.
